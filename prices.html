<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>စျေးနှုန်းများ (Live Prices)</title>
  <style>
    body{font-family:Padauk,system-ui,Arial;margin:0;background:#f5fbff;color:#123}
    .page{max-width:920px;margin:18px auto;padding:12px}
    .card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,0.06)}
    .iframe-wrapper{border-radius:10px;overflow:hidden;border:1px solid #e6eefb}
    .iframe-wrapper iframe{width:100%;height:80vh;border:0;display:block}
    @media(max-width:720px){.iframe-wrapper iframe{height:85vh}}
    .note{margin-top:12px;color:#2c6f45;font-size:0.95rem}
    a.back{display:inline-block;margin-bottom:10px;color:#1e6bb8;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <div class="page">
    <a class="back" href="./">← နောက်သို့</a>
    <div class="card">
      <h2 style="margin:0 0 10px 0;color:#1e6bb8">Live Prices (Google Sheet)</h2>
      <div class="iframe-wrapper">
        <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vT0Rbe_lK2zWyvMT9fc0oyNRsPFrOnassQp8fT2ptQbVC5PbPEOKJPo__cUcJHKYA3KFoZM5EFVQbNK/pubhtml?gid=0&single=true&widget=true&headers=false" title="Live prices" loading="lazy" sandbox="allow-same-origin allow-scripts allow-forms"></iframe>
      </div>
      <div class="note">မှတ်ချက် - Google Sheets ကို publish → “Publish to web” (pubhtml) ဖြင့်ထုတ်ထားပါကသာ embed ပေါ်ရပါမည်။</div>
    </div>
  </div>
</body>
</html>
